services:
  - type: web
    name: volunteer-login
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: volunteer-db
          property: connectionString
      # 【脆弱性⑤】を直すときに使う。Render がランダムな値を自動で作る
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: volunteer-db
    plan: free
    region: singapore
