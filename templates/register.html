{% extends "base.html" %}
{% block title %}ボランティア登録{% endblock %}
{% block content %}
  <h1>ボランティア登録</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>名前<input type="text" name="name" required></label>
    <label>メールアドレス<input type="email" name="email" required></label>
    <label>パスワード（8文字以上）<input type="password" name="password" required></label>
    <button type="submit">登録する</button>
  </form>
  <p class="link">すでに登録済みの方は <a href="{{ url_for('login') }}">ログイン</a></p>
{% endblock %}
