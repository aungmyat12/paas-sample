{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
  <h1>ログイン</h1>
  {% if message %}<p class="success">{{ message }}</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {# SQLインジェクションを試せるように、メール欄は type="text" にしています（type="email" だとブラウザが ' を含む入力を弾くため） #}
    <label>メールアドレス<input type="text" name="email" required></label>
    <label>パスワード<input type="password" name="password"></label>
    <button type="submit">ログイン</button>
  </form>
  <p class="link">はじめての方は <a href="{{ url_for('register') }}">新規登録</a></p>
{% endblock %}
